# eval-agents — tool tier (@devdigest/evals, agents/**).
# Runs only the subagents actually touched by this PR (via evals/scripts/ci-detect.mjs), and only
# if that agent has a written evals/agents/<name>/*.eval.ts. Needs the LiteLLM proxy (the Agent
# SDK speaks the Anthropic wire protocol only).
#
# Model: OpenRouter, default deepseek/deepseek-v4-flash (same default model DevDigest itself uses
# elsewhere — see server/src/vendor/shared/contracts/platform.ts). NOT yet verified here for
# subagent dispatch the way evals/README.md's "Which cheap model — verified" table verified
# google/gemini-2.5-flash (dispatches reliably) and deepseek/deepseek-chat (does NOT — fabricates
# a plausible "completed" response for a subagent call that never ran). Kept NON-BLOCKING regardless
# — this job's own log is the place to check whether v4-flash actually dispatches. Override via
# workflow_dispatch inputs (Actions tab → Run workflow), no code change needed — e.g. fall back to
# google/gemini-2.5-flash there if dispatch turns out unreliable.
name: eval-agents

on:
  push:
    branches: [main]
    paths:
      - '.claude/agents/**'
      - 'evals/agents/**'
      - 'evals/src/**'
      - '.github/workflows/eval-agents.yml'
  pull_request:
    paths:
      - '.claude/agents/**'
      - 'evals/agents/**'
      - 'evals/src/**'
      - '.github/workflows/eval-agents.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'EVAL_MODEL override (OpenRouter slug, e.g. google/gemini-2.5-flash)'
        required: false
        type: string
      judge_model:
        description: 'EVAL_JUDGE_MODEL override (OpenRouter slug)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eval-agents-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: ${{ inputs.model || 'deepseek/deepseek-v4-flash' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || 'deepseek/deepseek-v4-flash' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_BASE_URL: http://localhost:4000

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.detect.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files vs base
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          git fetch origin "$BASE" --depth=50
          {
            echo 'files<<EOF'
            git diff --name-only "origin/$BASE...HEAD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect affected agent evals
        id: detect
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: node evals/scripts/ci-detect.mjs

  agents:
    needs: changes
    if: needs.changes.outputs.agents != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      # continue-on-error HERE (not just at job level) so this check shows green in the PR —
      # the run still executes for real and its pass/fail is visible in this step's own log,
      # it just doesn't turn the job/check red on a model-capability miss (see header comment).
      # Use steps.run_tests.outcome (pre-continue-on-error) below, not failure() — failure()
      # reads the post-override conclusion, which continue-on-error already forced to success.
      - id: run_tests
        continue-on-error: true
        run: pnpm vitest run agents/${{ matrix.agent }}/${{ matrix.agent }}.eval.ts
      - if: steps.run_tests.outcome == 'failure'
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
